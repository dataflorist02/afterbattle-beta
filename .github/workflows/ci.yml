name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to full commit SHAs (spec 20 E8); Dependabot updates them (github-actions).
# actions/checkout v4.4.0, pnpm/action-setup v4.4.0, actions/setup-node v4.4.0,
# actions/upload-artifact v4.6.2,
# dtolnay/rust-toolchain branch `stable` (the toolchain itself is pinned below).

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:setup
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: pnpm audit --prod --audit-level high

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0
      - run: pnpm install --frozen-lockfile
      # The unsigned NSIS installer and its checksum, kept as a workflow artifact (no secrets
      # needed). The release installer is built by the author with scripts/release.ps1.
      - run: pnpm tauri build --bundles nsis
      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$bundle/SHA256SUMS.txt", "$hash  $($installer.Name)`n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afterbattle-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
