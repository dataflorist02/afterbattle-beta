<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kierunek C z mapami: Historia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@300;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A101C;color:#EEF1F6;font-family:Inter,system-ui,sans-serif}
a{color:#F3A36B}a:hover{color:#FFC08F}
.num{font-family:'Big Shoulders',Inter,sans-serif;font-weight:300}
.ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);color:#9AA6B8}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#9AA6B8;text-decoration:none}
.hrow{position:relative;display:grid;grid-template-columns:110px minmax(0,1.3fr) minmax(0,1fr) 110px 90px 90px 70px;gap:14px;align-items:center;min-height:64px;padding:0 22px;border-radius:14px;overflow:hidden;text-decoration:none;color:#EEF1F6;user-select:none;border:1px solid rgba(255,255,255,0.05)}
.hrow:hover{border-color:rgba(255,255,255,0.25)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,0.14);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-size:14px;color:#C9D1DC;background:transparent;border:0;padding:10px 20px;min-height:44px}
select{font:inherit;font-size:14px;color:#EEF1F6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 14px;min-height:44px;min-width:220px}
</style>
</helmet>
<div style="min-height: 1100px; display: flex; background: radial-gradient(900px 520px at 20% -10%, rgba(70,104,210,0.16), transparent 60%), #0A101C;">
  <nav aria-label="Główna nawigacja" style="flex: 0 0 96px; padding: 26px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; border-right: 1px solid rgba(255,255,255,0.05);">
    <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #F08A3C; color: #0A101C; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders', sans-serif; font-weight: 600; font-size: 24px; margin-bottom: 12px;">A</div>
    <a class="rail" href="Mapy-Sesja.dc.html"><span class="ico"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"></polyline></svg></span>Sesja</a>
    <a class="rail" href="Mapy-Czolg.dc.html"><span class="ico"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="14" width="18" height="5" rx="2.5"></rect><rect x="6" y="9" width="9" height="5" rx="1.5"></rect><line x1="15" y1="11.5" x2="21" y2="11.5"></line></svg></span>Czołgi</a>
    <a class="rail" href="#"><span class="ico"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg></span>Cele</a>
    <a class="rail" href="#" style="color: #EEF1F6;"><span class="ico" style="background: rgba(240,138,60,0.16); border-color: rgba(240,138,60,0.5); color: #F7B27A;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><polyline points="12 7.5 12 12 15 14"></polyline></svg></span>Historia</a>
  </nav>

  <main style="flex: 1 1 auto; min-width: 0; padding: 40px 56px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; max-width: 1344px;">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <h1 style="margin: 0; font-family: 'Big Shoulders', sans-serif; font-weight: 600; font-size: 52px; line-height: 1;">Historia</h1>
      <div class="seg" role="radiogroup" aria-label="Widok historii">
        <button type="button" role="radio" aria-checked="true" style="background: rgba(240,138,60,0.18); color: #FFF4EA; font-weight: 500;">Bitwy</button>
        <button type="button" role="radio" aria-checked="false">Sesje</button>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA6B8;">Czołg<select><option>Wszystkie</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA6B8;">Mapa<select><option>Wszystkie</option></select></label>
      <p style="margin: 0 0 0 auto; font-size: 13px; color: #9AA6B8;">Pas po prawej: grafika mapy z plików gry (tu zamienniki)</p>
    </div>

    <div style="display: grid; grid-template-columns: 110px minmax(0,1.3fr) minmax(0,1fr) 110px 90px 90px 70px; gap: 14px; padding: 0 23px; font-size: 13px; color: #8693A6;">
      <span>Wynik</span><span>Czołg</span><span>Mapa</span><span style="text-align: right;">Obrażenia</span><span style="text-align: right;">Asysta</span><span style="text-align: right;">Przetrwanie</span><span style="text-align: right;">Godz.</span>
    </div>

    <p style="margin: 6px 0 -8px; font-size: 14px; font-weight: 600; color: #C9D1DC;">Dziś</p>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <a class="hrow" href="Mapy-Bitwa.dc.html" style="{{r.bg}}">
          <span style="{{r.resStyle}}">{{r.res}}</span>
          <span style="display: flex; align-items: center; gap: 12px; min-width: 0;"><span aria-hidden="true" style="flex: none; width: 52px; height: 28px; border-radius: 7px; border: 1px dashed rgba(255,255,255,0.2);"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.tank}}</span></span>
          <span style="color: #DCE2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.map}}</span>
          <span class="num" style="font-size: 26px; text-align: right;">{{r.dmg}}</span>
          <span class="num" style="font-size: 22px; text-align: right; color: #DCE2EA;">{{r.ast}}</span>
          <span style="text-align: right; font-size: 14px; color: #DCE2EA;">{{r.surv}}</span>
          <span style="text-align: right; font-size: 14px; color: #C9D1DC;">{{r.time}}</span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = {
      'Rzeka Perłowa': ['#1F3550', '#6A7A55'], 'Nordskar': ['#3C3A44', '#8E8676'], 'Redshire': ['#3E5236', '#9A9A62'],
      'Lotnisko': ['#5C5A3E', '#B6A06A'], 'El Halluf': ['#6A5233', '#C2A26A'], 'Fiordy': ['#2E4660', '#A9B9C8'],
      'Paryż': ['#3D4655', '#8A8A84'], 'Lakeville': ['#2D4A5E', '#7A8F6A']
    };
    const data = [
      ['Wygrana','Vz. 60S Dravec','Rzeka Perłowa',4480,640,'przeżył','22:00'],
      ['Porażka','Concept No. 5','Nordskar',4170,580,'zginął','21:50'],
      ['Wygrana','UDES 14 Alt 5','Redshire',3860,540,'przeżył','21:40'],
      ['Wygrana','Vz. 60S Dravec','Lotnisko',3550,500,'zginął','21:30'],
      ['Porażka','LHMTV','El Halluf',3240,460,'zginął','21:20'],
      ['Wygrana','Vz. 60S Dravec','Fiordy',2930,420,'przeżył','21:10'],
      ['Wygrana','M53/M55','Paryż',2620,380,'zginął','21:00'],
      ['Porażka','UDES 14 Alt 5','Lakeville',2310,340,'zginął','20:50']
    ];
    const rows = data.map(([res, tank, map, d, a, s, time]) => {
      const [c1, c2] = pal[map];
      const loss = res === 'Porażka';
      const bg = 'background: linear-gradient(90deg, #121927 0%, #121927 52%, rgba(18,25,39,0.55) 78%, rgba(18,25,39,0.25) 100%), linear-gradient(125deg, ' + c1 + ', ' + c2 + ');' + (loss ? ' opacity: 0.82;' : '');
      return {
        res, tank, map, time, bg,
        resStyle: loss ? 'color: #9AA6B8;' : 'font-weight: 600;',
        dmg: d.toLocaleString('pl-PL'), ast: a.toLocaleString('pl-PL'),
        surv: s === 'przeżył' ? 'Przeżył' : 'Zginął'
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
