<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Afterbattle: wczytywanie, stan 62 procent" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Wzorzec ekranu ładowania (spec 29 §5): zimny kontur + rozgrzana część do wysokości postępu.
       W aplikacji wysokość maski = postęp (transform: scaleY), tu zamrożona na 62%. -->
  <defs>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="8">
      <stop offset="0" stop-color="#FFEBD0"/><stop offset="0.3" stop-color="#FFA556"/>
      <stop offset="0.65" stop-color="#E0661F"/><stop offset="1" stop-color="#9A3A1A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rise"><rect x="0" y="25.9" width="64" height="31.1"/></clipPath>
  </defs>
  <polygon points="32,9 53,55 43.5,55 32,29 20.5,55 11,55" fill="none" stroke="#8B97AB" stroke-opacity="0.38" stroke-width="0.9"/>
  <polyline points="24,47 32,40.5 40,47" fill="none" stroke="#8B97AB" stroke-opacity="0.38" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <g clip-path="url(#rise)" filter="url(#glow)">
    <polygon points="32,9 53,55 43.5,55 32,29 20.5,55 11,55" fill="none" stroke="url(#hot)" stroke-width="1.1"/>
    <polyline points="24,47 32,40.5 40,47" fill="none" stroke="url(#hot)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
