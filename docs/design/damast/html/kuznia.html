<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Damast: wykuwanie (makieta referencyjna)</title>
<style>body{margin:0;background:#0A101C;color:#EEF1F6;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px}
canvas{width:940px;height:440px;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);background:#161B23}
button{font:inherit;font-size:14px;color:#EEF1F6;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 18px;min-height:40px;cursor:pointer}
button.on{background:rgba(240,138,60,.16);border-color:rgba(240,138,60,.7)}.row{display:flex;gap:10px;align-items:center}
.ticks{width:940px;display:flex}.ticks span{flex:1;text-align:center;font-size:11px;color:#8B97AB}.muted{color:#9AA6B8;font-size:13px}</style></head><body>
<p class="muted">Makieta referencyjna (spec 34). CPU, per piksel: klatki animacji w 1/2 rozdzielczości, ostatnia w pełnej × devicePixelRatio. W aplikacji: WebGL2.</p>
<canvas id="c"></canvas><div class="ticks" id="t"></div><p id="s"></p>
<div class="row"><button data-k="hot" class="on">Sesja cieplej</button><button data-k="flat">Jak zwykle</button><button data-k="cool">Chłodniej</button><button id="f">Wykuj ponownie</button><label class="muted"><input type="checkbox" id="rm"> Ograniczony ruch</label></div>
<script>
function damastStats(s) {
  const r = s.b.map((x) => 0.6 * x.wn8 / s.avgWN8 + 0.4 * x.d / s.avgDmg[x.t]);
  const n = r.length, mean = r.reduce((a, b) => a + b, 0) / n;
  return { r: r, T: Math.round((mean - 1) * 100), n: n,
    dmg: Math.round(s.b.reduce((a, x) => a + x.d, 0) / n), wn8: Math.round(s.b.reduce((a, x) => a + x.wn8, 0) / n),
    wins: s.b.filter((x) => x.w).length, tier: s.b.reduce((a, x) => a + x.t, 0) / n,
    best: r.indexOf(Math.max.apply(null, r)) };
}
function damast(s, W, H, p) {
  const st = damastStats(s), b = s.b, n = b.length;
  const seed = b.reduce((a, x) => a + x.d + x.wn8, 0) % 997;
  const rnd = (i) => { const x = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453; return x - Math.floor(x); };
  const ph1 = seed * 0.0137, ph2 = seed * 0.0091;
  const zw = 940 / n, sig = zw * 0.7, sig2 = zw * 1.0;
  // stała sekwencja warstw (z ziarna), gęstość zależy od tieru bitwy
  const th = []; for (let i = 0; i < 9; i++) th.push([5 + rnd(100 + i) * 4, 1], [3 + rnd(200 + i) * 1.6, 0]);
  const cyc = th.reduce((a, x) => a + x[0], 0), LN = Math.ceil(cyc * 8);
  const LUT = new Float32Array(LN + 1), LT = new Uint8Array(LN + 1); let pos = 0;
  th.forEach((t, j) => { const e = pos + t[0]; for (let q = Math.floor(pos * 8); q < Math.min(LN, Math.ceil(e * 8)); q++) { LUT[q] = t[1] ? 0.70 + 0.1 * (j % 3) / 2 : 0.13 + 0.05 * (j % 3) / 2; LT[q] = t[1]; } pos = e; });
  const ease = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const amp = ease((p - 0.45) / 0.35), tintP = ease((p - 0.8) / 0.2);
  // parametry kolumn: ważona mieszanka bitew wzdłuż długości płytki (chronologia od lewej)
  const colAmp = new Float32Array(W), colDen = new Float32Array(W), colT = new Float32Array(W), colHeat = new Float32Array(W), colVis = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    const X = x * 940 / W; let sw = 0, sw2 = 0, a = 0, dn = 0, tt = 0;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * zw, w = Math.exp(-Math.pow(X - cx, 2) / (2 * sig * sig)), w2 = Math.exp(-Math.pow(X - cx, 2) / (2 * sig2 * sig2));
      sw += w; sw2 += w2; a += w * (0.45 + 0.9 * Math.min(1.6, b[i].d / s.avgDmg[b[i].t]));
      dn += w * (0.8 + 0.12 * (b[i].t - 8)); tt += w2 * Math.max(-1, Math.min(1, (st.r[i] - 1) / 0.3));
    }
    colAmp[x] = a / sw; colDen[x] = dn / sw; colT[x] = tt / sw2;
    const zi = X / zw, done = p / 0.55 * n; // bitwy pojawiają się po kolei
    colVis[x] = Math.max(0, Math.min(1, (done - zi) * 1.5 + 0.5));
    colHeat[x] = Math.max(0, 1 - Math.max(0, done - zi) / (n * 0.55)) * (1 - ease((p - 0.6) / 0.4));
  }
  // oczka: jedno na wygraną
  const eyes = [];
  b.forEach((x, i) => { if (x.w) eyes.push([(i + 0.5) * zw + (rnd(10 + i) - 0.5) * zw * 0.5, 80 + rnd(20 + i) * 280, (i % 2 ? 1 : -1) * (50 + 30 * Math.min(1.5, st.r[i])), 34 + 16 * rnd(30 + i)]); });
  const out = new Uint8ClampedArray(W * H * 4);
  const WARM = [[236, 205, 130], [206, 150, 88]], COOL = [[157, 182, 220], [92, 124, 180]];
  for (let y = 0; y < H; y++) {
    const Y = y * 440 / H;
    for (let x = 0; x < W; x++) {
      const X = x * 940 / W, o = (y * W + x) * 4;
      if (colVis[x] <= 0) { out[o] = 22; out[o + 1] = 27; out[o + 2] = 35; out[o + 3] = 255; continue; }
      let w = colAmp[x] * (30 * Math.sin(X * 0.009 + ph1 + 1.5 * Math.sin(Y * 0.012 + ph2)) + 14 * Math.sin(X * 0.026 - Y * 0.01 + ph2) + 5 * Math.sin(X * 0.05 + Y * 0.031 + ph1));
      for (const e of eyes) { const dx = X - e[0]; if (dx > 4 * e[3] || dx < -4 * e[3]) continue; const dy = (Y - e[1]) * 1.5; w += e[2] * Math.exp(-(dx * dx + dy * dy) / (2 * e[3] * e[3])); }
      const v = Y * colDen[x] + amp * w + 600;
      let q = Math.floor((v % cyc) * 8); if (q >= LN) q = LN - 1;
      let g = LUT[q]; const light = LT[q];
      g *= 0.86 + 0.2 * (1 - Y / 440);
      g += 0.12 * Math.exp(-Math.pow(X - 280 - 0.55 * Y, 2) / (2 * 140 * 140));
      g += (Math.sin(X * 12.9898 + Y * 78.233) * 43758.5453 % 1) * 0.022;
      let r = g * 236, gg = g * 240, bb = g * 247;
      const t = colT[x] * tintP;
      if (Math.abs(t) > 0.08) {
        const P = t > 0 ? WARM : COOL, f = Y / 440, a = Math.min(0.6, Math.abs(t) * 0.65);
        const tc = [0, 1, 2].map((c) => P[0][c] + (P[1][c] - P[0][c]) * f);
        const ov = (A, T) => { A /= 255; T /= 255; return 255 * (A < 0.5 ? 2 * A * T : 1 - 2 * (1 - A) * (1 - T)); };
        r += (ov(r, tc[0]) - r) * a; gg += (ov(gg, tc[1]) - gg) * a; bb += (ov(bb, tc[2]) - bb) * a;
      }
      const h = colHeat[x];
      if (h > 0) { const hh = h * (0.55 + 0.45 * Y / 440); r += ((light ? 255 : 190) - r) * hh; gg += ((light ? 200 : 74) - gg) * hh; bb += ((light ? 140 : 26) - bb) * hh; }
      const m = colVis[x]; r = 22 + (r - 22) * m; gg = 27 + (gg - 27) * m; bb = 35 + (bb - 35) * m;
      out[o] = r; out[o + 1] = gg; out[o + 2] = bb; out[o + 3] = 255;
    }
  }
  return out;
}


const S={"hot": {"avgWN8": 2100, "avgDmg": {"8": 1900, "9": 2400, "10": 2900, "11": 3300}, "b": [{"d": 3310, "t": 10, "wn8": 2600, "w": 1}, {"d": 4102, "t": 10, "wn8": 3300, "w": 1}, {"d": 2120, "t": 9, "wn8": 1900, "w": 0}, {"d": 5873, "t": 10, "wn8": 4400, "w": 1}, {"d": 3620, "t": 11, "wn8": 2300, "w": 1}, {"d": 2860, "t": 10, "wn8": 2000, "w": 0}, {"d": 3980, "t": 10, "wn8": 2900, "w": 1}, {"d": 1630, "t": 9, "wn8": 1500, "w": 0}, {"d": 4410, "t": 11, "wn8": 2700, "w": 1}, {"d": 3200, "t": 10, "wn8": 2300, "w": 0}, {"d": 2950, "t": 9, "wn8": 2600, "w": 1}, {"d": 3780, "t": 10, "wn8": 2800, "w": 1}, {"d": 4010, "t": 11, "wn8": 2400, "w": 0}]}, "flat": {"avgWN8": 2100, "avgDmg": {"8": 1900, "9": 2400, "10": 2900, "11": 3300}, "b": [{"d": 2860, "t": 10, "wn8": 2100, "w": 1}, {"d": 2410, "t": 9, "wn8": 2050, "w": 0}, {"d": 3010, "t": 10, "wn8": 2200, "w": 1}, {"d": 1850, "t": 8, "wn8": 2000, "w": 1}, {"d": 2740, "t": 10, "wn8": 1950, "w": 0}, {"d": 3300, "t": 11, "wn8": 2150, "w": 0}, {"d": 2980, "t": 10, "wn8": 2250, "w": 1}, {"d": 2350, "t": 9, "wn8": 1900, "w": 0}, {"d": 2900, "t": 10, "wn8": 2100, "w": 1}]}, "cool": {"avgWN8": 2100, "avgDmg": {"8": 1900, "9": 2400, "10": 2900, "11": 3300}, "b": [{"d": 1120, "t": 10, "wn8": 900, "w": 0}, {"d": 2010, "t": 9, "wn8": 1700, "w": 1}, {"d": 1630, "t": 10, "wn8": 1200, "w": 0}, {"d": 1480, "t": 8, "wn8": 1500, "w": 0}, {"d": 2200, "t": 10, "wn8": 1600, "w": 1}, {"d": 1450, "t": 9, "wn8": 1100, "w": 0}, {"d": 2600, "t": 11, "wn8": 1700, "w": 0}]}};
const R={8:'VIII',9:'IX',10:'X',11:'XI'};let key='hot',timer=null;
const cv=document.getElementById('c'),dpr=window.devicePixelRatio||1;
function draw(p,scale){const W=Math.round(940*scale),H=Math.round(440*scale);cv.width=W;cv.height=H;const x=cv.getContext('2d');const im=x.createImageData(W,H);im.data.set(damast(S[key],W,H,p));x.putImageData(im,0,0);}
function info(){const z=damastStats(S[key]);document.getElementById('t').innerHTML=S[key].b.map((b,i)=>'<span style="color:'+(i===z.best?'#F08A3C':'')+'">'+(b.w?'●':'○')+'<br>'+R[b.t]+'</span>').join('');
document.getElementById('s').textContent='WN8 '+z.wn8+' · obrażenia '+z.dmg+' · '+z.wins+' z '+z.n+' · średni tier '+z.tier.toFixed(1)+' · temperatura '+(z.T>0?'+':'')+z.T+'%';}
function forge(){clearInterval(timer);info();if(document.getElementById('rm').checked){draw(1,dpr);return;}const t0=performance.now();
timer=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/4200);if(p>=1){clearInterval(timer);draw(1,dpr);return;}draw(p,0.5);},40);}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{key=b.dataset.k;document.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b));forge();});
document.getElementById('f').onclick=forge;forge();
</script></body></html>
