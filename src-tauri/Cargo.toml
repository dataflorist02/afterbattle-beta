[package]
name = "afterbattle"
version = "1.0.0-beta.1"
description = "Privacy-first local World of Tanks session coach"
authors = ["Afterbattle contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[lib]
name = "afterbattle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
notify = "8.2"
sha2 = "0.11"
zip = { version = "9.5", default-features = false }
# E5-maps-hd: PNG encoder already in the build through Tauri (same version, no new crate).
png = "0.17.16"
# E5-maps-hd: BC1 block decoder for the map loading screens (MIT, pure Rust, no dependencies).
bcdec_rs = "0.2.1"

[dev-dependencies]
tempfile = "3"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
